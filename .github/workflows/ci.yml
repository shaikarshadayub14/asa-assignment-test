name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          NOTIFY_SERVICE_URL: ${{ secrets.NOTIFY_SERVICE_URL }}
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vulntracker-api:ci .

      - name: Run container and verify health endpoint
        run: |
          docker run -d --name vulntracker-api-ci \
            -p 8000:8000 \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e DB_USER="${{ secrets.DB_USER }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e ADMIN_API_KEY="${{ secrets.ADMIN_API_KEY }}" \
            -e NOTIFY_SERVICE_URL="${{ secrets.NOTIFY_SERVICE_URL }}" \
            vulntracker-api:ci

          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed"
          docker logs vulntracker-api-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f vulntracker-api-ci || true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image
        run: |
          docker tag vulntracker-api:ci ${{ secrets.DOCKERHUB_USERNAME }}/vulntracker-api:latest
          docker tag vulntracker-api:ci ${{ secrets.DOCKERHUB_USERNAME }}/vulntracker-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vulntracker-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vulntracker-api:${{ github.sha }}

  # TODO (candidates): Add the following security scanning jobs.
  # Tool selection is your decision — document your choices in findings.md.
  #
  # sast:
  #   Static Application Security Testing against app/ source code
  #   Upload JSON report as a build artifact named sast.<tool>.json
  #   Build should fail on critical findings
  #
  # sca:
  #   Dependency / Software Composition Analysis against requirements.txt
  #   Upload JSON report as a build artifact named sca.<tool>.json
  #   Build should fail on critical or high severity CVEs
  #
  # container-scan:
  #   Build the Docker image, then scan it for vulnerabilities and misconfigurations
  #   Upload JSON report as a build artifact named container.<tool>.json
  #
  # iac-scan:
  #   Scan the Helm chart or Terraform configuration for security misconfigurations
  #   Upload JSON report as a build artifact named iac.<tool>.json
